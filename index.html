<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Klassens Grill- och Spelträff</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f7fafc;
      color: #2d3748;
      margin: 0;
      padding: 20px;
      max-width: 650px;
      margin-inline: auto;
    }
    h1, h2 { text-align: center; color: #2c5282; }
    .hidden { display: none; }
    .step {
      background: #fff;
      border-radius: 10px;
      padding: 20px;
      margin: 20px 0;
      box-shadow: 0 3px 6px rgba(0,0,0,0.1);
    }
    button {
      background-color: #2b6cb0;
      color: white;
      border: none;
      padding: 10px 16px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 15px;
      margin-top: 10px;
    }
    button:hover { background-color: #2c5282; }
    label { display: block; margin: 8px 0; }
    input[type="text"], input[type="email"], textarea {
      width: 100%; padding: 8px;
      border-radius: 4px; border: 1px solid #cbd5e0;
      margin-top: 5px;
      box-sizing: border-box;
    }
    .error { color: #c53030; margin-top: 10px; }
  </style>
</head>
<body>

  <h1>🎓 Klassens Grill- och Spelträff / Class BBQ & Games</h1>

  <div class="step" id="step1">
    <h2>Välj språk / Choose language</h2>
    <button onclick="setLanguage('sv')">🇸🇪 Svenska</button>
    <button onclick="setLanguage('en')">🇬🇧 English</button>
  </div>

  <div class="step hidden" id="step2">
    <h2 id="welcomeText"></h2>
    <button onclick="nextStep(3)">➡️ Start</button>
  </div>

  <div class="step hidden" id="step3">
    <h2 id="dateTitle"></h2>
    <div id="dateOptions"></div>
    <label><input type="checkbox" id="otherCheck"> <span id="otherLabel"></span></label>
    <input type="text" id="otherDate" class="hidden" placeholder="" />
    <button onclick="nextStep(4)">➡️ Nästa / Next</button>
  </div>

  <div class="step hidden" id="step4">
    <h2 id="foodTitle"></h2>
    <textarea id="foodText" rows="3" placeholder=""></textarea>
    <button onclick="nextStep(5)">➡️ Nästa / Next</button>
  </div>

  <div class="step hidden" id="step5">
    <h2 id="locationTitle"></h2>
    <textarea id="locationText" rows="3" placeholder=""></textarea>
    <button onclick="nextStep(6)">➡️ Nästa / Next</button>
  </div>

  <div class="step hidden" id="step6">
    <h2 id="emailTitle"></h2>
    <input type="email" id="emailText" placeholder="" required />
    <button onclick="finish()">✅ Skicka / Submit</button>
    <div id="errorMsg" class="error hidden"></div>
  </div>

  <div class="step hidden" id="thankyou">
    <h2 id="thanksText"></h2>
    <p id="thanksSubText"></p>
  </div>

<script type="module">
import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.7.0/firebase-app.js';
import { getFirestore, collection, addDoc, serverTimestamp } from 'https://www.gstatic.com/firebasejs/10.7.0/firebase-firestore.js';

const firebaseConfig = {
  apiKey: "AIzaSyBXjjGK-cAkKC4CSOUyxYa23BP7TYOmTkw",
  authDomain: "grill-spel.firebaseapp.com",
  projectId: "grill-spel",
  storageBucket: "grill-spel.firebasestorage.app",
  messagingSenderId: "558218357374",
  appId: "1:558218357374:web:eeaef6d629c6da47a0062f"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

let lang = 'sv';

function setLanguage(chosen) {
  lang = chosen;
  showStep(2);
  document.getElementById('welcomeText').innerText =
    lang === 'sv'
      ? "Hej! 🌞 Vi planerar en klassens grill- och spelträff i juni. Hjälp oss hitta datum och plats!"
      : "Hi there! 🌞 We're planning a class BBQ & games day in June. Help us pick the best date and place!";
}

function showStep(n){
  document.querySelectorAll('.step').forEach(s => s.classList.add('hidden'));
  document.getElementById('step'+n)?.classList.remove('hidden');
  if(n===3) showDates();
  if(n===4) setupFood();
  if(n===5) setupLocation();
  if(n===6) setupEmail();
}

function nextStep(n){ showStep(n); }

function showDates(){
  document.getElementById('dateTitle').innerText = lang === 'sv'
    ? "Vilka datum passar dig bäst?"
    : "Which dates work best for you?";

  const svDates = ["5 juni", "6 juni", "7 juni", "12 juni", "13 juni", "14 juni"];
  const enDates = ["June 5", "June 6", "June 7", "June 12", "June 13", "June 14"];
  const container = document.getElementById('dateOptions');
  container.innerHTML = "";
  (lang==='sv' ? svDates : enDates).forEach(date=>{
    const lbl = document.createElement('label');
    lbl.innerHTML = `<input type="checkbox"> ${date}`;
    container.appendChild(lbl);
  });
  document.getElementById('otherLabel').innerText = lang === 'sv' ? "Annat datum" : "Other date";
  document.getElementById('otherDate').placeholder = lang === 'sv' ? "Skriv annat datum..." : "Enter another date...";
  document.getElementById('otherCheck').onchange = e => {
    document.getElementById('otherDate').classList.toggle('hidden', !e.target.checked);
  };
}

function setupFood(){
  document.getElementById('foodTitle').innerText = lang === 'sv'
    ? "Har du några matrestriktioner eller allergier?"
    : "Do you have any food restrictions or allergies?";
  document.getElementById('foodText').placeholder = lang==='sv'
    ? "T.ex. vegetarian, ingen laktos, nötallergi..."
    : "E.g. vegetarian, lactose free, nut allergy...";
}

function setupLocation(){
  document.getElementById('locationTitle').innerText = lang === 'sv'
    ? "Har du förslag på en fin plats för grillning och spel?"
    : "Do you know any nice places for BBQ and games?";
  document.getElementById('locationText').placeholder = lang==='sv'
    ? "T.ex. Stadsparken, sjön vid campus..."
    : "E.g. City Park, lake near campus...";
}

function setupEmail(){
  document.getElementById('emailTitle').innerText = lang === 'sv'
    ? "Din e-postadress (för kontakt)"
    : "Your email address (for contact)";
  document.getElementById('emailText').placeholder = lang === 'sv' ? "din@email.com" : "your@email.com";
}

async function finish(){
  const email = document.getElementById('emailText').value;
  const errorMsg = document.getElementById('errorMsg');
  
  if (!email) {
    errorMsg.innerText = lang === 'sv' ? "E-post är obligatorisk" : "Email is required";
    errorMsg.classList.remove('hidden');
    return;
  }

  const selectedDates = Array.from(document.querySelectorAll('#dateOptions input:checked'))
    .map(cb => cb.parentElement.textContent.trim());
  const otherDate = document.getElementById('otherDate').value;
  if(otherDate) selectedDates.push(otherDate);

  try {
    await addDoc(collection(db, "responses"), {
      timestamp: serverTimestamp(),
      email: email,
      dates: selectedDates,
      food: document.getElementById('foodText').value,
      location: document.getElementById('locationText').value
    });

    document.querySelectorAll('.step').forEach(s=>s.classList.add('hidden'));
    document.getElementById('thankyou').classList.remove('hidden');
    document.getElementById('thanksText').innerText = lang==='sv'
      ? "Tack för ditt svar! 🙌"
      : "Thank you for your response! 🙌";
    document.getElementById('thanksSubText').innerText = lang==='sv'
      ? "Vi sammanställer svaren snart och bestämmer datum och plats."
      : "We'll review responses soon and decide date and location.";
  } catch (error) {
    errorMsg.innerText = lang === 'sv' ? "Fel vid sparning. Försök igen." : "Error saving. Please try again.";
    errorMsg.classList.remove('hidden');
    console.error("Error:", error);
  }
}

window.setLanguage = setLanguage;
window.nextStep = nextStep;
window.showDates = showDates;
window.setupFood = setupFood;
window.setupLocation = setupLocation;
window.setupEmail = setupEmail;
window.finish = finish;
</script>
</body>
</html>
